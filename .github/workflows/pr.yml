name: Pull request checks
on:
  pull_request:
    branches: [integration, main]
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/foundation.yml
    with:
      # The foundation needs initial three-OS evidence before integration has its workflows.
      # Later ticket PRs retain the planned Linux fast gate; integration/nightly run all three.
      platforms: ${{ github.head_ref == 'ticket/01-foundation' && '["ubuntu-latest", "macos-latest", "windows-latest"]' || '["ubuntu-latest"]' }}
      base: ${{ github.event.pull_request.base.sha }}
