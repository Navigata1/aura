name: Pull request checks
on:
  pull_request:
    branches: [integration, main]
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/foundation.yml
    with:
      # Every merge needs all three hosts: Linux-only PR checks missed the C03 Windows encoding failure.
      platforms: '["ubuntu-latest", "macos-latest", "windows-latest"]'
      base: ${{ github.event.pull_request.base.sha }}
